<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F6F8FC">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Concierge</title>
  <link rel="icon" href="icon-180.png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
<div id="boot" class="wrap"><div class="top"><div class="brand" id="brand"></div></div><div class="loading" id="bootMsg">Caricamento…</div></div>
<div id="page" class="hidden">
<div class="wrap">
  <div class="top"><div class="brand" id="brand"></div><button class="info" id="infoBtn" aria-label="Come funziona"><i class="ti ti-info-small"></i></button></div>
  <div id="help" class="card hidden"></div>

  <div class="ring-wrap">
    <div id="ring" class="ring"><i class="ri ti ti-door"></i><div class="rt" id="rt"></div><div class="rs" id="rs"></div></div>
  </div>

  <!-- HOME -->
  <div id="home">
    <div class="tabs">
      <div class="tab on" data-t="call"><i class="ti ti-phone"></i>Chiama un condomino</div>
      <div class="tab" data-t="pin"><i class="ti ti-grid-dots"></i>Ho un PIN</div>
    </div>

    <div id="tab-call" style="margin-top:14px">
      <input id="q" placeholder="Cerca per cognome o nome" autocomplete="off">
      <div class="list" id="list"></div>
    </div>

    <div id="tab-pin" class="card hidden">
      <div class="loc" id="loc"><i class="ti ti-map-pin"></i> Per usare il PIN devi essere davanti al portone</div>
      <div class="pinbox" id="pinbox"></div>
      <div class="keypad" id="keypad"></div>
      <button class="btn" id="pinGo" style="margin-top:14px" disabled>Apri il portone</button>
    </div>
  </div>

  <!-- FOTO + CHIAMATA -->
  <div id="photoStep" class="card hidden">
    <div class="muted">Stai chiamando</div>
    <div style="font-size:20px;font-weight:700;margin:2px 0 14px" id="who"></div>
    <button class="btn" id="videoGo"><i class="ti ti-video"></i> Videochiama</button>
    <p class="muted center" style="margin:8px 0 14px">Ti vede prima di rispondere e può aprirti direttamente.</p>
    <div class="muted center" style="margin:4px 0 10px">oppure, senza video</div>
    <img id="preview" class="photo hidden" alt="Anteprima foto">
    <div class="row">
      <button class="btn ghost" id="camBtn"><i class="ti ti-camera"></i> Foto</button>
      <input id="cam" type="file" accept="image/*" capture="user" class="hidden">
      <button class="btn ghost" id="callGo"><i class="ti ti-phone"></i> Chiama</button>
    </div>
    <p class="muted center">La foto è facoltativa e si cancella appena rispondono.</p>
    <button class="btn ghost" id="back1">Indietro</button>
  </div>

  <!-- IN CHIAMATA -->
  <div id="calling" class="hidden">
    <div id="vwrap" class="hidden">
      <div class="vbar"><div><div class="t" id="vtitle"></div><div class="s" id="vsub"></div></div><span class="pill b" id="vcount"></span></div>
      <div class="vbox">
        <div class="vmsg" id="vmsg"><i class="ti ti-video"></i><span>Attivo la fotocamera…</span></div>
        <video id="vRemote" class="big hidden" playsinline autoplay muted></video>
        <video id="vLocal" class="big mirror" playsinline autoplay muted></video>
        <span class="vtag" id="vtag">Tu</span>
      </div>
      <audio id="vAudio" autoplay playsinline></audio>
    </div>
    <div class="card" style="margin-top:12px">
      <div class="muted center" id="countdown"></div>
      <button class="btn ghost" id="cancel" style="margin-top:12px">Annulla chiamata</button>
    </div>
  </div>

  <!-- ESITO -->
  <div id="done" class="hidden" style="margin-top:18px">
    <button class="btn ghost" id="again">Torna all’inizio</button>
  </div>
</div>
</div>
<script src="https://unpkg.com/@daily-co/daily-js@0.95.0/dist/daily.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
var BOOT;
function main() {
window.HELP = '<p class="muted">1. Scegli chi vuoi chiamare: tutto l\u2019appartamento o una persona.<br>2. Tocca Videochiama: chi chiami ti vede e può parlarti. In alternativa chiama con una foto.<br>3. Attendi: l\u2019anello diventa verde quando ti aprono.<br><br>Hai un PIN? Tocca \u201cHo un PIN\u201d: serve essere davanti al portone con la posizione attiva.</p>';
var S = { uid: null, mid: '', rname: '', photo: null, callId: null, timer: null, loc: null, pin: '', busy: false, reset: null, video: false };
var ring = $('#ring');

function status(t, s) { $('#rt').textContent = t; $('#rs').textContent = s || ''; }
function show(id) {
  ['home', 'photoStep', 'calling', 'done'].forEach(function (x) { $('#' + x).classList.toggle('hidden', x !== id); });
}
function ringVisible(on) { document.querySelector('.ring-wrap').classList.toggle('hidden', !on); }
function endVideo() {
  if (!S.video) return;
  S.video = false;
  VC.leave();
  ['vLocal', 'vRemote', 'vAudio'].forEach(function (id) { var el = $('#' + id); try { el.srcObject = null; } catch (e) {} });
  $('#vwrap').classList.add('hidden');
  ringVisible(true);
}
function idle() {
  stopPolling();
  endVideo();
  setRing(ring, '', 'door');
  status(BOOT.building, BOOT.address);
  show('home');
}
function result(cls, icon, t, s) {
  stopPolling();
  endVideo();
  setRing(ring, cls, icon);
  status(t, s);
  show('done');
  clearTimeout(S.reset);
  S.reset = setTimeout(idle, 20000);
}

// ---------- tabs ----------
document.querySelectorAll('.tab').forEach(function (t) {
  t.onclick = function () {
    document.querySelectorAll('.tab').forEach(function (x) { x.classList.toggle('on', x === t); });
    $('#tab-call').classList.toggle('hidden', t.dataset.t !== 'call');
    $('#tab-pin').classList.toggle('hidden', t.dataset.t !== 'pin');
    if (t.dataset.t === 'pin' && !S.loc) locate(false);
  };
});

// ---------- rubrica: cognome → persone ----------
var OPEN = null;
function unitLabel(u) { return u.size > 1 ? 'Famiglia ' + u.surname : u.surname; }
function renderList() {
  var q = $('#q').value.trim().toLowerCase();
  var items = BOOT.units.filter(function (u) {
    var hay = (u.surname + ' ' + u.detail + ' ' + u.members.map(function (m) { return m.name; }).join(' ')).toLowerCase();
    return !q || hay.indexOf(q) >= 0;
  });
  $('#list').innerHTML = items.map(function (u) {
    var direct = u.members.length === 0 || (u.size === 1 && u.members.length === 1);
    var open = !direct && (OPEN === u.id || (q && u.surname.toLowerCase().indexOf(q) < 0));
    var h = '<div class="item" data-u="' + esc(u.id) + '"' + (direct ? ' data-direct="1"' : '') + '>' +
      '<div class="av"><i class="ti ti-' + (u.size > 1 ? 'users' : 'user') + '"></i></div>' +
      '<div class="tx"><div class="n">' + esc(u.surname) + '</div><div class="d">' + esc(u.detail) + '</div></div>' +
      '<i class="chev ti ti-chevron-' + (direct ? 'right' : (open ? 'up' : 'down')) + '"></i></div>';
    if (open) {
      h += '<div class="subs">';
      if (u.size > 1) h += '<div class="sub-item" data-u="' + esc(u.id) + '" data-m=""><div class="av"><i class="ti ti-users"></i></div><span class="tx">Tutti</span><i class="chev ti ti-chevron-right"></i></div>';
      u.members.forEach(function (m) {
        h += '<div class="sub-item" data-u="' + esc(u.id) + '" data-m="' + esc(m.id) + '"><div class="av"><i class="ti ti-user"></i></div><span class="tx">' +
          esc(m.name) + ' ' + esc(u.surname) + '</span><i class="chev ti ti-chevron-right"></i></div>';
      });
      h += '</div>';
    }
    return h;
  }).join('') || '<p class="muted center">Nessun risultato</p>';
  $('#list').querySelectorAll('.item').forEach(function (el) {
    el.onclick = function () {
      if (el.dataset.direct) return pick(el.dataset.u, '');
      OPEN = OPEN === el.dataset.u ? null : el.dataset.u;
      renderList();
    };
  });
  $('#list').querySelectorAll('.sub-item').forEach(function (el) {
    el.onclick = function () { pick(el.dataset.u, el.dataset.m); };
  });
}
$('#q').oninput = renderList;

function pick(uid, mid) {
  var u = BOOT.units.find(function (x) { return x.id === uid; });
  var m = mid ? u.members.find(function (x) { return x.id === mid; }) : null;
  S.uid = uid; S.mid = mid || ''; S.photo = null;
  S.rname = m ? m.name + ' ' + u.surname : unitLabel(u);
  $('#who').textContent = S.rname + ' · ' + u.detail;
  $('#preview').classList.add('hidden');
  $('#preview').removeAttribute('src');
  $('#camBtn').innerHTML = '<i class="ti ti-camera"></i> Foto';
  show('photoStep');
  if (!S.loc) locate(true);   // non bloccante: serve solo a mostrare la distanza al condomino
}
$('#back1').onclick = idle;

// ---------- foto effimera ----------
$('#camBtn').onclick = function () { $('#cam').click(); };
$('#cam').onchange = function (e) {
  var f = e.target.files && e.target.files[0];
  if (!f) return;
  compress(f).then(function (data) {
    S.photo = data;
    $('#preview').src = data;
    $('#preview').classList.remove('hidden');
    $('#camBtn').innerHTML = '<i class="ti ti-camera-rotate"></i> Rifai';
  }).catch(function () { toast('Foto non valida, riprova'); });
  e.target.value = '';
};
function compress(file) {
  return new Promise(function (res, rej) {
    var img = new Image(), url = URL.createObjectURL(file);
    img.onload = function () {
      var max = 640, s = Math.min(1, max / Math.max(img.width, img.height));
      var c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      var q = 0.7, d = c.toDataURL('image/jpeg', q);
      while (d.length > 90000 && q > 0.25) { q -= 0.1; d = c.toDataURL('image/jpeg', q); }
      URL.revokeObjectURL(url);
      d.length > 97000 ? rej() : res(d);
    };
    img.onerror = function () { URL.revokeObjectURL(url); rej(); };
    img.src = url;
  });
}

// ---------- chiamata ----------
function poll(until) {
  S.timer = setInterval(function () {
    var left = Math.max(0, Math.round((until() - Date.now()) / 1000));
    if (S.talking) {
      $('#countdown').textContent = 'In chiamata';
      $('#vcount').textContent = '';
    } else {
      $('#countdown').textContent = 'In attesa di risposta · ' + left + ' s';
      $('#vcount').textContent = left + ' s';
    }
    if (S.busy) return;
    S.busy = true;
    run('getCallStatus', S.callId).then(function (st) { handle(st.status, st.by); })
      .catch(function () {}).then(function () { S.busy = false; });
  }, 2000);
}

$('#callGo').onclick = function () {
  $('#callGo').disabled = true;
  S.talking = false;
  $('#cancel').textContent = 'Annulla chiamata';
  show('calling');
  setRing(ring, 'pulse', 'phone-call');
  status('Sto chiamando…', S.rname);
  $('#countdown').textContent = 'Invio della chiamata…';
  run('startCall', S.uid, S.mid, S.photo, S.loc && !S.loc.err ? S.loc : null, 'photo').then(function (r) {
    S.callId = r.callId; S.photo = null;
    var until = Date.now() + BOOT.callTimeout * 1000;
    poll(function () { return until; });
  }).catch(function (e) {
    result('amber', 'alert-triangle', 'Chiamata non riuscita', errMsg(e));
  }).then(function () { $('#callGo').disabled = false; });
};

$('#videoGo').onclick = function () {
  $('#videoGo').disabled = true;
  S.talking = false; S.video = true;
  $('#cancel').textContent = 'Annulla chiamata';
  VC.unlockAudio($('#vAudio'));
  show('calling');
  ringVisible(false);
  $('#vwrap').classList.remove('hidden');
  $('#vRemote').classList.add('hidden');
  $('#vLocal').className = 'big mirror';
  $('#vmsg').classList.remove('hidden');
  $('#vtag').textContent = 'Tu';
  $('#vtitle').textContent = 'Sto chiamando…';
  $('#vsub').textContent = S.rname;
  $('#countdown').textContent = 'Avvio della videochiamata…';
  run('startCall', S.uid, S.mid, null, S.loc && !S.loc.err ? S.loc : null, 'video').then(function (r) {
    S.callId = r.callId;
    if (!r.video) throw new Error('Video non disponibile');
    var until = Date.now() + BOOT.callTimeout * 1000;
    poll(function () { return until; });
    return VC.join({
      url: r.video.url, token: r.video.token, cam: true, mic: true,
      local: $('#vLocal'), remote: $('#vRemote'), audio: $('#vAudio'),
      onRemote: function (on) {
        $('#vRemote').classList.toggle('hidden', !on);
        $('#vLocal').className = on ? 'pip mirror' : 'big mirror';
        $('#vtag').textContent = on ? S.rname : 'Tu';
      }
    }).then(function () { $('#vmsg').classList.add('hidden'); });
  }).catch(function (e) {
    var msg = errMsg(e);
    if (/fotocamera/i.test(msg)) msg += ', oppure chiama con la foto';
    if (S.callId) run('cancelCall', S.callId).catch(function () {});
    result('amber', 'video-off', 'Videochiamata non riuscita', msg);
  }).then(function () { $('#videoGo').disabled = false; });
};

function stopPolling() { if (S.timer) clearInterval(S.timer); S.timer = null; }
function handle(st, by) {
  if (st === 'ringing') return;
  if (st === 'talking') {
    if (!S.talking) {
      S.talking = true;
      $('#vtitle').innerHTML = '<span class="dotlive"></span>In chiamata';
      $('#vsub').textContent = by ? by + ' ti sta parlando' : S.rname;
      $('#cancel').textContent = 'Riaggancia';
      status('In chiamata', by || S.rname);
    }
    return;
  }
  if (st === 'opened') result('green', 'circle-check', 'Accesso consentito', 'Spingi il portone');
  else if (st === 'denied') result('red', 'circle-x', 'Accesso negato', 'Non ti hanno aperto');
  else if (st === 'timeout') result('amber', 'clock', 'Nessuna risposta', 'Riprova o usa un PIN');
  else if (st === 'door_error') result('amber', 'alert-triangle', 'Problema tecnico', 'Il portone non risponde');
  else if (st === 'cancelled') idle();
  else if (st === 'ended') result('amber', 'phone-off', 'Chiamata terminata', 'Riprova o usa un PIN');
  else result('amber', 'clock', 'Chiamata terminata', '');
}
$('#cancel').onclick = function () {
  var id = S.callId;
  $('#cancel').textContent = 'Annulla chiamata';
  idle();
  if (id) run('cancelCall', id).catch(function () {});
};
$('#again').onclick = function () { clearTimeout(S.reset); idle(); };

// ---------- PIN + posizione ----------
function locate(silent) {
  if (!silent) $('#loc').innerHTML = '<i class="ti ti-map-pin"></i> Verifico la tua posizione…';
  return getLoc(12000).then(function (l) {
    if (l && !l.err) {
      S.loc = l;
      $('#loc').innerHTML = '<span style="color:var(--green)"><i class="ti ti-map-pin-check"></i> Posizione verificata · precisione ±' + Math.round(l.acc) + ' m</span>';
    } else {
      S.loc = null;
      if (!silent) {
        $('#loc').innerHTML = (l && l.err === 1)
          ? '<i class="ti ti-map-pin-off"></i> Serve il permesso di posizione per usare il PIN. Abilitalo nelle impostazioni del browser e <a href="#" id="retry">riprova</a>.'
          : '<i class="ti ti-map-pin-off"></i> Posizione non disponibile. <a href="#" id="retry">Riprova</a>';
        var a = $('#retry');
        if (a) a.onclick = function (e) { e.preventDefault(); locate(false); };
      }
    }
    return S.loc;
  });
}

var DEVICE = deviceId();

var KEYS = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'C', '0', '⌫'];
$('#keypad').innerHTML = KEYS.map(function (k) { return '<div class="key" data-k="' + k + '">' + k + '</div>'; }).join('');
$('#keypad').querySelectorAll('.key').forEach(function (el) {
  el.onclick = function () {
    var k = el.dataset.k;
    if (k === 'C') S.pin = '';
    else if (k === '⌫') S.pin = S.pin.slice(0, -1);
    else if (S.pin.length < 6) S.pin += k;
    renderPin();
  };
});
function renderPin() {
  var h = '';
  for (var i = 0; i < 6; i++) h += '<span class="' + (i < S.pin.length ? 'f' : '') + '">' + (S.pin[i] || '') + '</span>';
  $('#pinbox').innerHTML = h;
  $('#pinGo').disabled = S.pin.length !== 6;
}

$('#pinGo').onclick = function () {
  $('#pinGo').disabled = true;
  setRing(ring, 'amber pulse', 'shield-check');
  status('Verifico…', 'PIN e posizione');
  var go = S.loc ? Promise.resolve(S.loc) : locate(false);
  go.then(function (loc) { return run('checkPin', S.pin, loc, DEVICE); }).then(function (r) {
    S.pin = ''; renderPin();
    if (r.ok) return result('green', 'circle-check', 'Accesso consentito', (r.label ? r.label + ' · ' : '') + 'Spingi il portone');
    var M = {
      invalid: ['PIN non valido', r.left > 0 ? 'Tentativi rimasti: ' + r.left : 'Riprova tra qualche minuto'],
      expired: ['Pass scaduto', 'Chiedi un nuovo PIN al condomino'],
      notyet: ['Pass non ancora attivo', r.start ? 'Valido da ' + dayTime(r.start) : ''],
      used: ['PIN già utilizzato', 'Il pass valeva per un solo ingresso'],
      far: ['Sei troppo lontano', 'Avvicinati al portone (ora sei a ' + r.dist + ' m)'],
      noloc: ['Posizione necessaria', 'Abilita la localizzazione e riprova'],
      locked: ['Telefono bloccato', 'Troppi PIN errati: riprova ' + (r.until ? 'dopo le ' + hhmm(r.until) : 'più tardi') + ' o chiama il condomino'],
      nodevice: ['Errore', 'Ricarica la pagina e riprova'],
      setup: ['Portone non configurato', 'L’amministratore deve impostare la posizione'],
      door: ['Problema tecnico', 'Il portone non risponde']
    };
    var m = M[r.reason] || ['Accesso negato', ''];
    result(r.reason === 'invalid' || r.reason === 'locked' ? 'red' : 'amber', r.reason === 'locked' ? 'lock' : (r.reason === 'far' || r.reason === 'noloc' ? 'map-pin-off' : 'circle-x'), m[0], m[1]);
    if (r.reason === 'far' || r.reason === 'noloc') S.loc = null;   // al prossimo tentativo rileva di nuovo
    if (r.reason === 'locked') document.querySelector('.tab[data-t="call"]').click();
  }).catch(function (e) {
    result('amber', 'alert-triangle', 'Errore', errMsg(e));
  });
};

renderList();
renderPin();
idle();
}

function start(p) {
  p.then(function (b) {
    BOOT = b;
    document.getElementById('boot').remove();
    document.getElementById('page').classList.remove('hidden');
    renderBrand();
    main();
    renderBrand();
    loadBrand();
  }).catch(function (e) {
    console.error(e);
    var m = document.getElementById('bootMsg');
    if (m) {
      m.innerHTML = '<div class="login"><p>' + esc(errMsg(e)) + '</p>' +
        (e && e.denied ? '<button class="btn ghost" style="width:auto" onclick="AUTH.logout()">Accedi con un altro account</button>' : '') + '</div>';
    } else toast(errMsg(e), 6000);
  });
}
AUTH.ready().then(function () {
  if (qs('v')) return;                       // ?v=1 forza la vista visitatore
  return run('me').then(function (me) {
    if (me && me.member) { location.replace('condomino.html'); return new Promise(function () {}); }
  }).catch(function () {});
}).then(function () { start(run('v_boot')); });
</script>
</body>
</html>
